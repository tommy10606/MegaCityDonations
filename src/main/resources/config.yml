# Donation tracking with explicit operator-run permission activation commands.
page-size: 8

# Currency code, e.g. USD, CAD, EUR, GBP. Changes display only, not conversion.
# USD is also the default if this setting is omitted. Amounts use two decimals.
currency: USD

# Check the latest public stable GitHub release once per server boot.
update-checker:
  enabled: true

# Run once per configured permission node, as console, only on explicit
# /donation activate or /donation deactivate. No automatic commands on add/remove.
# Change these templates for your permission plugin; {uuid} is also supported.
# Commands have no leading slash. An empty string disables that action.
permission-commands:
  activate: 'manuaddp {player} {permission}'
  deactivate: 'manudelp {player} {permission}'

# repeatable defaults to false if omitted. Nodes appear in hover text and
# are also passed to the explicit activation/deactivation commands.
donations:
  nickname:
    name: Nickname
    price: '5.00'
    repeatable: false
    permissions:
      - essentials.nick
      - essentials.nick.color
      - essentials.nick.format
  eff7:
    name: Eff7
    price: '10.00'
    repeatable: true
    permissions: []
